<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>MM Bil</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0f14;
      color: #eef4fb;
      font: 400 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
    }

    body.mode-adult .app,
    body.mode-shadow .app {
      position: relative;
      box-shadow:
        0 0 0 6px rgba(255,196,0,.95),
        0 0 0 18px rgba(255,196,0,.20),
        0 0 48px rgba(255,196,0,.38);
    }

    body.mode-shadow .app {
      box-shadow:
        0 0 0 6px rgba(255,72,72,.96),
        0 0 0 18px rgba(255,72,72,.22),
        0 0 56px rgba(255,72,72,.42);
    }

    body.mode-adult .app::before,
    body.mode-shadow .app::before,
    body.mode-adult .app::after,
    body.mode-shadow .app::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      width: 22px;
      z-index: 50;
      pointer-events: none;
      background: rgba(255,196,0,.96);
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.28);
    }

    body.mode-adult .app::before,
    body.mode-shadow .app::before {
      left: 0;
    }

    body.mode-adult .app::after,
    body.mode-shadow .app::after {
      right: 0;
    }

    body.mode-shadow .app::before,
    body.mode-shadow .app::after {
      background: rgba(255,72,72,.96);
    }

    body.mode-adult .panel,
    body.mode-adult .bar {
      border-color: rgba(255,196,0,.62);
      box-shadow: 0 0 0 2px rgba(255,196,0,.16) inset;
    }

    body.mode-shadow .panel,
    body.mode-shadow .bar {
      border-color: rgba(255,72,72,.62);
      box-shadow: 0 0 0 2px rgba(255,72,72,.16) inset;
    }

    body.mode-shadow .app {
      animation: brutalisPageReveal 680ms ease-out both;
    }

    .app {
      min-height: calc(100vh - 24px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .bar,
    .panel {
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      background: #121821;
    }

    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
    }

    .adult-banner {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      padding: 10px 16px;
      border: 2px solid rgba(255,196,0,.82);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffd84d, #ffbf00);
      color: #0a0a0a;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.55);
      box-shadow:
        0 10px 22px rgba(0,0,0,.28),
        inset 0 -3px 0 rgba(120,84,0,.24),
        0 0 0 4px rgba(255,196,0,.20);
    }

    .adult-banner.show {
      display: flex;
    }

    .adult-banner.shadow {
      background: linear-gradient(180deg, #ff6b6b, #e11d48);
      color: #fff7c2;
      border-color: rgba(255,72,72,.82);
      box-shadow:
        0 10px 22px rgba(0,0,0,.34),
        inset 0 -3px 0 rgba(90,8,26,.30),
        0 0 0 4px rgba(255,72,72,.22);
    }

    .adult-banner span {
      display: inline-block;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .adult-banner.shadow span {
      background: transparent;
      color: inherit;
    }

    .mode-wash {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      background: rgba(255,196,0,.10);
    }

    .mode-wash.show {
      display: block;
    }

    .mode-wash.shadow {
      background: rgba(255,72,72,.12);
    }

    .brutalis-fx {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      display: none;
    }

    .brutalis-fx.play {
      display: block;
    }

    .brutalis-blackout {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
    }

    .brutalis-fx.play .brutalis-blackout {
      animation: brutalisBlackout 1200ms ease-out forwards;
    }

    .brutalis-curtain {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 15vh;
      min-height: 84px;
      transform: translateY(-120%);
      background:
        linear-gradient(180deg, #2e0006 0%, #5f0010 18%, #7a0015 36%, #5c0010 62%, #2a0007 100%);
      box-shadow:
        0 14px 36px rgba(0,0,0,.42),
        inset 0 -8px 22px rgba(0,0,0,.36),
        inset 0 10px 16px rgba(255,170,170,.08);
      overflow: hidden;
    }

    .brutalis-fx.play .brutalis-curtain {
      animation: brutalisCurtainDrop 980ms cubic-bezier(.2,.86,.18,1) forwards;
    }

    .brutalis-curtain::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% -18%, rgba(255,220,220,.26), transparent 38%),
        repeating-linear-gradient(
          90deg,
          rgba(25,0,0,.22) 0 4.5%,
          rgba(122,0,21,.94) 4.5% 10.5%,
          rgba(255,185,185,.18) 10.5% 12.5%,
          rgba(88,0,15,.98) 12.5% 18%
        );
      opacity: .98;
      transform: scaleY(1.04);
      transform-origin: top;
    }

    .brutalis-curtain::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 38px;
      background:
        radial-gradient(circle at 5% 0, #4f000c 0 14px, transparent 15px),
        radial-gradient(circle at 14% 0, #7e0014 0 18px, transparent 19px),
        radial-gradient(circle at 27% 0, #58000e 0 13px, transparent 14px),
        radial-gradient(circle at 39% 0, #8a0017 0 20px, transparent 21px),
        radial-gradient(circle at 53% 0, #52000d 0 14px, transparent 15px),
        radial-gradient(circle at 66% 0, #810015 0 19px, transparent 20px),
        radial-gradient(circle at 79% 0, #57000d 0 13px, transparent 14px),
        radial-gradient(circle at 92% 0, #850016 0 18px, transparent 19px);
      opacity: .98;
    }

    .brutalis-title {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-top: 4px;
      color: #ffe8e8;
      font-size: clamp(30px, 5vw, 54px);
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-shadow:
        0 2px 0 #2b0000,
        0 4px 0 #410008,
        0 8px 18px rgba(0,0,0,.56),
        0 0 24px rgba(255,40,40,.28);
      opacity: 0;
    }

    .brutalis-title span {
      position: relative;
      display: inline-block;
      padding: 4px 18px 10px;
      border-top: 1px solid rgba(255,228,228,.18);
      border-bottom: 1px solid rgba(0,0,0,.28);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.12));
    }

    .brutalis-title span::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 100%;
      height: 20px;
      background:
        linear-gradient(180deg, rgba(140,0,0,.98), rgba(60,0,0,.1)),
        radial-gradient(circle at 8% 0, rgba(120,0,0,.98) 0 4px, transparent 5px),
        radial-gradient(circle at 24% 0, rgba(160,0,0,.98) 0 5px, transparent 6px),
        radial-gradient(circle at 41% 0, rgba(140,0,0,.98) 0 6px, transparent 7px),
        radial-gradient(circle at 59% 0, rgba(170,0,0,.98) 0 5px, transparent 6px),
        radial-gradient(circle at 78% 0, rgba(130,0,0,.98) 0 6px, transparent 7px),
        radial-gradient(circle at 93% 0, rgba(170,0,0,.98) 0 4px, transparent 5px);
      opacity: .92;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.24));
    }

    .brutalis-fx.play .brutalis-title {
      animation: brutalisTitleIn 620ms ease-out 340ms forwards;
    }

    @keyframes brutalisBlackout {
      0% { opacity: 0; }
      14% { opacity: .96; }
      58% { opacity: .82; }
      100% { opacity: 0; }
    }

    @keyframes brutalisCurtainDrop {
      0% { transform: translateY(-120%); }
      58% { transform: translateY(0); }
      100% { transform: translateY(0); }
    }

    @keyframes brutalisTitleIn {
      0% { opacity: 0; transform: translateY(-10px) scale(.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes brutalisPageReveal {
      0% { opacity: .04; filter: saturate(.7) brightness(.55); }
      100% { opacity: 1; filter: none; }
    }

    .title strong,
    .title span {
      display: block;
    }

    .title strong {
      font-size: 26px;
      line-height: 1;
    }

    .title span,
    .muted,
    .empty {
      color: #9fb1c4;
    }

    .qr {
      width: 96px;
      height: 96px;
      display: block;
      border-radius: 10px;
      background: #fff;
      flex: none;
    }

    .stage {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30%;
      gap: 12px;
    }

    .image-panel,
    .text-panel {
      min-height: 0;
      padding: 12px;
    }

    .image-wrap {
      width: 100%;
      height: 100%;
      min-height: 280px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      overflow: hidden;
      background: #090d12;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #090d12;
    }

    .empty {
      padding: 24px;
      text-align: center;
      font-size: 34px;
      line-height: 1.15;
    }

    .text-panel {
      display: grid;
      grid-template-rows: auto 1fr 1fr;
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 12px;
      background: #0d131a;
    }

    .card h2 {
      margin: 0 0 8px;
      color: #7fd2ff;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-line {
      font-size: 24px;
      font-weight: 700;
    }

    .copy {
      margin: 0;
      font-size: 28px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
      font-size: 13px;
      color: #7f8d9b;
    }

    @media (max-width: 900px) {
      .stage {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div id="modeWash" class="mode-wash"></div>
    <div id="brutalisFx" class="brutalis-fx" aria-hidden="true">
      <div class="brutalis-blackout"></div>
      <div class="brutalis-curtain">
        <div class="brutalis-title"><span>Brutalis Mode</span></div>
      </div>
    </div>
    <div id="adultBanner" class="adult-banner" aria-live="polite"><span>Voksenmodus</span></div>

    <header class="bar">
      <div class="title">
        <strong>Magiske Mikrofonen</strong>
        <span id="statusText" class="muted">Kobler til...</span>
      </div>
      <img id="qrImage" class="qr" alt="QR-kode til mobil">
    </header>

    <section class="stage">
      <section class="panel image-panel" aria-label="Bilde">
        <div class="image-wrap">
          <img id="roastImage" alt="Roast-bilde" hidden>
          <div id="emptyState" class="empty">Scan QR-koden for å åpne mobilen.</div>
        </div>
      </section>

      <aside class="panel text-panel">
        <section class="card">
          <h2>Status</h2>
          <div id="phaseText" class="status-line">Venter</div>
        </section>
        <section class="card">
          <h2>Fra Mobilen</h2>
          <p id="transcriptText" class="copy">Ingen tekst enda</p>
        </section>
        <section class="card">
          <h2>Svar</h2>
          <p id="answerText" class="copy">Ingen svar enda</p>
        </section>
      </aside>
    </section>

    <footer class="footer">
      <span id="sourceText">-</span>
      <span id="updatedText">Ikke oppdatert</span>
    </footer>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var accessKey = params.get("k") || "";
      var demoMode = params.get("demo") || "";
      var stateEndpoint = params.get("state") || "/bianca/state";
      var mobileUrl = params.get("mobile") || (location.origin + "/bianca/bil-kontroll");
      var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=192x192&data=" + encodeURIComponent(mobileUrl + (accessKey ? "?k=" + encodeURIComponent(accessKey) : ""));
      var statusText = document.getElementById("statusText");
      var phaseText = document.getElementById("phaseText");
      var transcriptText = document.getElementById("transcriptText");
      var answerText = document.getElementById("answerText");
      var roastImage = document.getElementById("roastImage");
      var emptyState = document.getElementById("emptyState");
      var qrImage = document.getElementById("qrImage");
      var sourceText = document.getElementById("sourceText");
      var updatedText = document.getElementById("updatedText");
      var adultBanner = document.getElementById("adultBanner");
      var modeWash = document.getElementById("modeWash");
      var brutalisFx = document.getElementById("brutalisFx");
      var lastSerialized = "";
      var lastRoastMode = "";

      qrImage.src = qrUrl;

      function labelPhase(phase) {
        var labels = {
          ready: "Klar",
          recording: "Lytter",
          transcribing: "Transkriberer",
          thinking: "Tenker",
          speaking: "Snakker",
          done: "Ferdig",
          error: "Feil"
        };
        return labels[phase] || phase || "Ukjent";
      }

      function updateView(payload) {
        if (!payload || typeof payload !== "object") return;
        var serialized = JSON.stringify(payload);
        if (serialized === lastSerialized) return;
        lastSerialized = serialized;

        var phase = payload.phase || "ready";
        var transcript = payload.transcript || "";
        var answer = payload.answer || "";
        var image = payload.roastImageUrl || "";
        var source = payload.source || "bianca-state";
        var roastMode = demoMode || payload.roastMode || "";
        var enteredShadow = roastMode === "shadow" && lastRoastMode !== "shadow";
        lastRoastMode = roastMode;

        statusText.textContent = labelPhase(phase);
        phaseText.textContent = labelPhase(phase);
        transcriptText.textContent = transcript || "Ingen tekst enda";
        answerText.textContent = answer || "Ingen svar enda";
        sourceText.textContent = source;
        updatedText.textContent = "Oppdatert " + new Date().toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

        document.body.classList.toggle("mode-adult", roastMode === "adult");
        document.body.classList.toggle("mode-shadow", roastMode === "shadow");
        if (roastMode === "adult") {
          adultBanner.innerHTML = "<span>Voksenmodus</span>";
          adultBanner.className = "adult-banner show";
          modeWash.className = "mode-wash show";
        } else if (roastMode === "shadow") {
          adultBanner.innerHTML = "<span>Brutalis</span>";
          adultBanner.className = "adult-banner show shadow";
          modeWash.className = "mode-wash show shadow";
        } else {
          adultBanner.className = "adult-banner";
          modeWash.className = "mode-wash";
        }

        if (enteredShadow) {
          brutalisFx.className = "brutalis-fx";
          void brutalisFx.offsetWidth;
          brutalisFx.className = "brutalis-fx play";
          setTimeout(function () {
            brutalisFx.className = "brutalis-fx";
          }, 1400);
        }

        if (image) {
          roastImage.src = image;
          roastImage.hidden = false;
          emptyState.hidden = true;
        } else {
          roastImage.hidden = true;
          roastImage.removeAttribute("src");
          emptyState.hidden = false;
          emptyState.textContent = transcript ? "Venter på roast-bilde." : "Scan QR-koden for å åpne mobilen.";
        }
      }

      function poll() {
        if (demoMode) {
          updateView({
            phase: "ready",
            transcript: "",
            answer: "",
            source: "demo",
            roastMode: demoMode
          });
          return;
        }
        fetch(stateEndpoint, {
          headers: {
            "accept": "application/json",
            "x-bianca-key": accessKey
          },
          cache: "no-store"
        })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(updateView)
          .catch(function (error) {
            statusText.textContent = "Offline";
            phaseText.textContent = "Fant ikke live-data";
            sourceText.textContent = error.message;
          });
      }

      poll();
      setInterval(poll, 1200);
    }());
  </script>
</body>
</html>
