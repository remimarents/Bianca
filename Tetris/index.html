<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Biancas Tetris</title>
  <link rel="stylesheet" href="./style.css" />
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tetris"><meta name="mobile-web-app-capable" content="yes"><link rel="stylesheet" href="../assets/ui-glass.css?v=1"><link rel="stylesheet" href="../assets/ui-play.css?v=1"></head>
<body class="glass-ui glass-tetris">
  <main class="app">
    <section class="game-card">
      <header class="play-header"><a href="../" aria-label="Til spillene">←</a><span>Tetris</span><details class="game-settings"><summary aria-label="Innstillinger">•••</summary><div class="settings-popover"><p style="font-size:13px;line-height:1.5;margin:4px">Dra brikken og slipp for å plassere. Trykk på brettet for å rotere.</p><button id="soundBtn">Lyd: på</button><button id="musicBtn">Musikk: av</button><button id="quitBtn">Start på nytt</button><details><summary>Rekorder</summary><ol id="highscores"></ol></details></div></details></header>
      <div class="score-strip"><span>Poeng <b id="score">0</b></span><span>Linjer <b id="lines">0</b></span><span>Nivå <b id="level">1</b></span></div>

      <div class="game-layout">
        <canvas id="game" width="300" height="600"></canvas>

        <aside class="side"><span>Neste</span><canvas id="next" width="120" height="120"></canvas></aside>
      </div>
    </section>

    <section class="touch-controls">
      <button id="leftBtn" aria-label="Flytt til venstre">◀</button>
      <button id="rotateBtn" aria-label="Roter">⟳</button>
      <button id="rightBtn" aria-label="Flytt til høyre">▶</button>
      <button id="downBtn" aria-label="Flytt ned">▼</button>
      <button id="dropBtn" aria-label="Slipp brikken">⤓</button>
    </section>
  </main>

  <script type="module" src="./main.js?v=20261117-drag"></script>
<script src="pwa.js" data-app-name="Biancas Tetris" defer></script></body>
</html>
