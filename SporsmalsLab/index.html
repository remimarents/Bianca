<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Spørsmåls Lab</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#070a0f;color:#f3f7fb;font-family:Arial,Helvetica,sans-serif}
    body{overflow-x:hidden;background:
      linear-gradient(180deg,#080b12 0%,#101722 48%,#06080d 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(180deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:34px 34px,34px 34px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.18));}
    .app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px;gap:16px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;width:100%;margin:0 auto}
    .brand small{display:block;color:#55e6d9;font-size:12px;font-weight:900;letter-spacing:0;text-transform:uppercase}
    .brand h1{margin:4px 0 0;font-size:clamp(30px,8vw,48px);line-height:.94;letter-spacing:0}
    .phase{border:1px solid rgba(85,230,217,.42);background:#10212a;color:#8ffbf1;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:900;text-transform:uppercase;min-width:72px;text-align:center}
    .radio-wrap{display:grid;place-items:center;align-content:center;min-height:0}
    .radio{position:relative;width:min(92vw,420px);aspect-ratio:7/11;margin-top:6px;border-radius:30px;background:
      linear-gradient(145deg,#252d35 0%,#10161d 48%,#070a0f 100%);
      border:2px solid #3d4a55;box-shadow:0 28px 80px rgba(0,0,0,.52),inset 0 2px 0 rgba(255,255,255,.14),inset 0 -8px 18px rgba(0,0,0,.42);padding:20px}
    .radio:before{content:"";position:absolute;left:18%;top:-72px;width:14px;height:86px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#151b22,#5b6975,#151b22);box-shadow:0 0 0 2px #05070a}
    .radio:after{content:"";position:absolute;right:20px;top:54px;width:7px;height:70%;border-radius:8px;background:linear-gradient(180deg,#52616c,#121820);opacity:.7}
    .topbar{height:34px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .leds{display:flex;gap:8px}.led{width:12px;height:12px;border-radius:50%;background:#f04444;box-shadow:0 0 16px #f04444}.led.green{background:#42f07d;box-shadow:0 0 16px #42f07d}.led.blue{background:#4fc3ff;box-shadow:0 0 16px #4fc3ff}
    .knobs{display:flex;gap:10px}.knob{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7e8b96,#202832 60%,#07090c);border:2px solid #59656e;box-shadow:inset -4px -5px 8px rgba(0,0,0,.45)}
    .screen{margin:16px 0 14px;border-radius:12px;border:2px solid #263d3d;background:#0b1818;color:#9fffe9;box-shadow:inset 0 0 22px rgba(82,255,222,.13);padding:12px;min-height:88px;display:grid;align-content:center;gap:6px;text-transform:uppercase}
    .screen b{font-size:22px;line-height:1;letter-spacing:0}.screen span{font-size:12px;color:#55e6d9;font-weight:900}
    .speaker{height:112px;border-radius:18px;background:#111820;border:1px solid #38444d;padding:17px;display:grid;gap:8px;box-shadow:inset 0 0 18px rgba(0,0,0,.42)}
    .slot{border-radius:999px;background:#040609;height:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
    .controls{display:grid;grid-template-columns:1fr 112px;gap:14px;align-items:stretch;margin-top:14px}
    .button{width:100%;height:112px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffcf44,#d97913);color:#140d04;font-size:24px;line-height:1.02;font-weight:900;box-shadow:0 10px 0 #7d3905,0 18px 28px rgba(0,0,0,.34),inset 0 2px 0 rgba(255,255,255,.52);touch-action:none;user-select:none;-webkit-user-select:none;text-transform:uppercase}
    .button.recording{transform:translateY(5px);box-shadow:0 5px 0 #68050b,0 12px 22px rgba(0,0,0,.35);background:linear-gradient(180deg,#ff5160,#b80d1f);color:#fff}
    .button.sending{transform:translateY(3px);box-shadow:0 7px 0 #064b55,0 12px 22px rgba(0,0,0,.35);background:linear-gradient(180deg,#52f4ff,#078092);color:#031014}
    .button:disabled{opacity:.74}
    .sidekeys{display:grid;gap:8px}.sidekey{border-radius:12px;background:#1d2630;border:1px solid #4a5964;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
    .status-panel{max-width:560px;width:100%;margin:0 auto;display:grid;gap:10px;background:#0f141c;border:1px solid #303a44;border-radius:14px;padding:12px;box-shadow:0 16px 36px rgba(0,0,0,.32)}
    .hint{margin:0;color:#d7e2ea;font-size:16px;font-weight:900;text-align:center}
    .log{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bubble{border-radius:10px;background:#151d26;border:1px solid #303d48;padding:10px;min-width:0}
    .bubble b{display:block;margin-bottom:5px;color:#55e6d9;font-size:11px;text-transform:uppercase}.bubble p{margin:0;color:#f6f8fb;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
    .fallback{display:grid;grid-template-columns:1fr auto;gap:8px}.fallback input{width:100%;border:1px solid #3b4854;background:#080c12;color:#fff;border-radius:10px;padding:12px;font-size:16px}.fallback input::placeholder{color:#7e8d98}.fallback button,.play{border:0;border-radius:10px;background:#55e6d9;color:#061114;padding:0 16px;font-weight:900}
    .play{display:none;width:100%;padding:13px;font-size:16px}.play.show{display:block}
    footer{max-width:560px;width:100%;margin:0 auto;color:#94a4b0;font-size:12px;text-align:center;font-weight:800}
    @media(max-width:430px){.app{padding:14px}.radio{border-radius:24px;padding:16px}.screen{min-height:78px}.speaker{height:94px}.controls{grid-template-columns:1fr 92px}.button{height:100px;font-size:21px}.log{grid-template-columns:1fr}.sidekey{min-height:26px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><small>Biancas kontrollradio</small><h1>Spørsmåls Lab</h1></div>
      <span id="phase" class="phase">Klar</span>
    </header>
    <section class="radio-wrap" aria-label="Sci-fi walkie talkie">
      <div class="radio">
        <div class="topbar">
          <div class="leds"><span class="led green"></span><span class="led blue"></span><span class="led"></span></div>
          <div class="knobs"><span class="knob"></span><span class="knob"></span></div>
        </div>
        <div class="screen">
          <b>Trykk og snakk</b>
          <span>Kanal: Sandra / Backend: Bianca</span>
        </div>
        <div class="speaker" aria-hidden="true">
          <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span>
        </div>
        <div class="controls">
          <button id="ptt" class="button" type="button">TRYKK<br>SNAKK</button>
          <div class="sidekeys" aria-hidden="true"><span class="sidekey"></span><span class="sidekey"></span><span class="sidekey"></span></div>
        </div>
      </div>
    </section>
    <section class="status-panel">
      <p id="hint" class="hint">Hold inne, snakk, slipp.</p>
      <button id="play" class="play" type="button">Spill svar</button>
      <div class="log">
        <div class="bubble"><b>Du sa</b><p id="transcript">Venter på beskjed.</p></div>
        <div class="bubble"><b>Sandra</b><p id="answer">Klar.</p></div>
      </div>
      <form id="textForm" class="fallback">
        <input id="textInput" autocomplete="off" placeholder="Skriv hvis tale feiler">
        <button>Send</button>
      </form>
    </section>
    <footer>Lyden går via denne telefonen. Koble telefonen til bilen med Bluetooth hvis svaret skal ut i høyttalerne.</footer>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script>
    var BASE = 'https://marentscloud.duckdns.org:10443/bianca';
    var ptt = document.getElementById('ptt');
    var phase = document.getElementById('phase');
    var hint = document.getElementById('hint');
    var transcriptEl = document.getElementById('transcript');
    var answerEl = document.getElementById('answer');
    var audio = document.getElementById('audio');
    var play = document.getElementById('play');
    var textForm = document.getElementById('textForm');
    var textInput = document.getElementById('textInput');
    var recognition = null, mediaRecorder = null, mediaStream = null, listening = false, sending = false, playingReply = false, speechUnlocked = false;
    var pendingTranscript = '', transcriptSent = false, ignoreNextClick = false, resetTimer = null, currentAudioUrl = null, recordedChunks = [], recordingMode = '';
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var silentWav = 'data:audio/wav;base64,UklGRkgAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YSQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
    audio.preload = 'auto';
    audio.playsInline = true;

    function setPhase(text, cls) {
      phase.textContent = text;
      ptt.className = 'button' + (cls ? ' ' + cls : '');
    }
    function setPttLabel(big, small) {
      ptt.innerHTML = big + '<br>' + small;
    }
    function readyForNextTurn(status) {
      sending = false;
      playingReply = false;
      listening = false;
      ptt.disabled = false;
      textInput.disabled = false;
      setPhase(status || 'Klar');
      setPttLabel('TRYKK', 'SNAKK');
      hint.textContent = 'Hold inne, snakk, slipp.';
    }
    function clearAudioUrl() {
      if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
      currentAudioUrl = null;
      audio.removeAttribute('src');
      try { audio.load(); } catch (_) {}
    }
    function unlockSpeech() {
      if (speechUnlocked) return Promise.resolve(true);
      audio.src = silentWav;
      audio.volume = 0.01;
      return audio.play().then(function () {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = 1;
        speechUnlocked = true;
        return true;
      }).catch(function () { return false; });
    }
    function speakFromUrl(url) {
      if (!url) { readyForNextTurn('Klar'); return; }
      playingReply = true;
      clearAudioUrl();
      audio.src = url;
      audio.onplay = function () { setPhase('Snakker'); };
      audio.onended = function () { clearAudioUrl(); readyForNextTurn('Klar'); };
      audio.onerror = function () { clearAudioUrl(); readyForNextTurn('Lyd-feil'); };
      audio.play().catch(function () {
        play.className = 'play show';
        readyForNextTurn('Trykk spill');
      });
    }
    function setupRecognition() {
      if (!SpeechRecognition) {
        recognition = null;
        setPttLabel('TRYKK', 'REC');
        hint.textContent = window.MediaRecorder ? 'Hold inne, snakk, slipp.' : 'Denne nettleseren støtter ikke tale.';
        setPhase(window.MediaRecorder ? 'Klar' : 'Ingen tale');
        return;
      }
      if (recognition) {
        recognition.onstart = null;
        recognition.onend = null;
        recognition.onerror = null;
        recognition.onresult = null;
        try { recognition.abort(); } catch (_) {}
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'nb-NO';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onstart = function () {
        listening = true;
        pendingTranscript = '';
        transcriptSent = false;
        setPhase('Lytter', 'recording');
        setPttLabel('LYTTER', 'SLIPP');
        hint.textContent = 'Snakk nå.';
      };
      recognition.onend = function () {
        listening = false;
        setPttLabel('TRYKK', 'SNAKK');
        ptt.classList.remove('recording');
        var transcript = pendingTranscript.trim();
        if (transcript && !transcriptSent) {
          transcriptSent = true;
          sendText(transcript);
          resetRecognitionSoon();
          return;
        }
        if (phase.textContent === 'Lytter' || phase.textContent === 'Avslutter') setPhase('Klar');
        resetRecognitionSoon();
      };
      recognition.onerror = function (event) {
        listening = false;
        ptt.classList.remove('recording');
        setPhase(event.error || 'Tale-feil');
        hint.textContent = event.error || 'Talegjenkjenning feilet.';
        resetRecognitionSoon();
      };
      recognition.onresult = function (event) {
        var finalText = '';
        var interimText = '';
        for (var i = event.resultIndex; i < event.results.length; i++) {
          var text = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += text;
          else interimText += text;
        }
        pendingTranscript = (finalText || interimText || pendingTranscript).trim();
        if (pendingTranscript) {
          transcriptEl.textContent = pendingTranscript;
          textInput.value = pendingTranscript;
        }
        if (finalText.trim() && !transcriptSent) {
          transcriptSent = true;
          try { recognition.stop(); } catch (_) {}
          sendText(finalText);
          resetRecognitionSoon();
        }
      };
    }
    function resetRecognitionSoon() {
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        resetTimer = null;
        setupRecognition();
      }, 120);
    }
    function mediaRecorderType() {
      var options = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
      if (!window.MediaRecorder) return '';
      for (var i = 0; i < options.length; i++) {
        if (MediaRecorder.isTypeSupported(options[i])) return options[i];
      }
      return '';
    }
    function ensureMediaStream() {
      if (mediaStream && mediaStream.active) return Promise.resolve(mediaStream);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        return Promise.reject(new Error('Mikrofon krever HTTPS'));
      }
      return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        mediaStream = stream;
        return stream;
      });
    }
    function startRecordingFallback(e) {
      if (e) e.preventDefault();
      unlockSpeech();
      if (listening || sending || playingReply) return;
      ensureMediaStream().then(function (stream) {
        var type = mediaRecorderType();
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
        recordingMode = 'media';
        mediaRecorder.ondataavailable = function (event) {
          if (event.data && event.data.size) recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = finishRecordingFallback;
        listening = true;
        transcriptSent = false;
        setPhase('Tar opp', 'recording');
        setPttLabel('TAR OPP', 'SLIPP');
        hint.textContent = 'Snakk nå.';
        mediaRecorder.start();
      }).catch(function (error) {
        readyForNextTurn(error.message || 'Mikrofon-feil');
      });
    }
    function stopRecordingFallback(e) {
      if (e) e.preventDefault();
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      setPhase('Sender lyd', 'sending');
      setPttLabel('VENT', 'STT');
      try { mediaRecorder.stop(); } catch (_) {}
    }
    function finishRecordingFallback() {
      if (transcriptSent) return;
      transcriptSent = true;
      listening = false;
      sending = true;
      ptt.disabled = true;
      textInput.disabled = true;
      var type = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : 'audio/webm';
      var blob = new Blob(recordedChunks, { type: type });
      recordedChunks = [];
      if (!blob.size) return failed(new Error('Tomt lydklipp'));
      fetch(BASE + '/api/ptt', {
        method: 'POST',
        headers: { 'content-type': type },
        body: blob
      })
        .then(function (r) { return r.json(); })
        .then(done)
        .catch(failed);
    }
    function startListening(e) {
      if (e) e.preventDefault();
      unlockSpeech();
      if (!recognition) return startRecordingFallback(e);
      if (listening || sending || playingReply) return;
      pendingTranscript = '';
      transcriptSent = false;
      recordingMode = 'speech';
      try {
        recognition.start();
      } catch (error) {
        if (!String(error.message || '').includes('already started')) startRecordingFallback(e);
      }
    }
    function stopListening(e) {
      if (e) e.preventDefault();
      if (recordingMode === 'media') return stopRecordingFallback(e);
      if (!recognition || !listening) return;
      setPhase('Avslutter');
      try { recognition.stop(); } catch (_) {}
    }
    function sendText(text) {
      var input = String(text || '').trim();
      if (!input || sending) return;
      sending = true;
      ptt.disabled = true;
      textInput.disabled = true;
      transcriptEl.textContent = input;
      setPhase('Tenker', 'sending');
      setPttLabel('VENT', 'SANDRA');
      hint.textContent = 'Sandra svarer.';
      fetch(BASE + '/api/text', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: input }) })
        .then(function (r) { return r.json(); })
        .then(done)
        .catch(failed);
    }
    function done(data) {
      if (!data.ok) return failed(new Error(data.error || 'Feil'));
      transcriptEl.textContent = data.transcript || 'Ingen tekst.';
      answerEl.textContent = data.answer || 'Ingen svartekst.';
      textInput.value = '';
      if (data.audioUrl) {
        speakFromUrl(data.publicAudioUrl || data.audioUrl);
      } else {
        readyForNextTurn('Klar');
      }
    }
    function failed(err) {
      readyForNextTurn('Feilet');
      hint.textContent = err && err.message ? err.message : 'Noe feilet.';
    }
    textForm.addEventListener('submit', function (e) {
      e.preventDefault();
      unlockSpeech();
      sendText(textInput.value);
    });
    play.addEventListener('click', function () { audio.play(); play.className = 'play'; });
    ptt.addEventListener('pointerdown', function (event) { event.preventDefault(); ignoreNextClick = true; startListening(event); });
    ptt.addEventListener('pointerup', function (event) { event.preventDefault(); stopListening(event); });
    ptt.addEventListener('pointercancel', stopListening);
    ptt.addEventListener('pointerleave', function (event) { if (event.pointerType !== 'mouse') stopListening(event); });
    ptt.addEventListener('touchstart', function (event) { event.preventDefault(); ignoreNextClick = true; startListening(event); }, { passive: false });
    ptt.addEventListener('touchend', function (event) { event.preventDefault(); stopListening(event); }, { passive: false });
    ptt.addEventListener('touchcancel', function (event) { event.preventDefault(); stopListening(event); }, { passive: false });
    ptt.addEventListener('click', function (event) {
      if (ignoreNextClick) { ignoreNextClick = false; return; }
      if (listening) stopListening(event);
      else startListening(event);
    });
    setupRecognition();
    readyForNextTurn(SpeechRecognition || window.MediaRecorder ? 'Klar' : 'Ingen tale');
  </script>
</body>
</html>
