<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Spørsmåls Lab</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#071019;color:#f3f7fb;font-family:Arial,Helvetica,sans-serif}
    body{overflow-x:hidden;background:
      radial-gradient(circle at 20% 12%,rgba(234,87,255,.26),transparent 28%),
      radial-gradient(circle at 82% 18%,rgba(55,232,255,.28),transparent 26%),
      linear-gradient(180deg,#071019 0%,#122339 48%,#071019 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(180deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:34px 34px,34px 34px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.18));}
    .app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:1fr auto;padding:16px;gap:12px}
    header{position:absolute;left:50%;top:18px;z-index:3;transform:translateX(-50%);width:min(92vw,430px);display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px}
    .brand{text-align:center;text-shadow:0 0 18px rgba(132,78,255,.72)}
    .brand small{display:block;color:#3ff7ff;font-size:15px;font-weight:900;letter-spacing:0}
    .brand h1{margin:0;font-size:clamp(38px,10vw,54px);line-height:.94;letter-spacing:0;color:#f3f6ff}
    .phase{border:2px solid rgba(77,246,255,.78);background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.34),rgba(46,20,84,.92));color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;padding:0;font-size:0;font-weight:900;text-align:center;box-shadow:0 0 18px rgba(194,77,255,.7)}
    .phase:before{content:"";width:14px;height:14px;border-radius:50%;background:#58fff4;box-shadow:0 0 16px #58fff4}
    .radio-wrap{display:grid;place-items:center;align-content:center;min-height:0;padding-top:86px}
    .radio-shell{position:relative;width:min(94vw,430px);display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center}
    .toolbar{align-self:stretch;border:1px solid rgba(61,244,255,.34);border-radius:22px;background:linear-gradient(180deg,rgba(11,30,50,.88),rgba(6,17,30,.74));box-shadow:inset 0 0 22px rgba(54,230,255,.18),0 18px 42px rgba(0,0,0,.34);display:grid;place-items:center;padding:14px 8px;gap:18px;color:#bffcff}
    .toolicon{width:38px;height:38px;border-radius:12px;border:1px solid rgba(82,247,255,.58);display:grid;place-items:center;font-size:24px;box-shadow:0 0 14px rgba(76,232,255,.22)}
    .divider{width:34px;height:2px;border-radius:999px;background:#46f7ff;box-shadow:0 0 11px #46f7ff}
    .radio{position:relative;width:100%;aspect-ratio:7/12;margin-top:14px;border-radius:38px 38px 70px 70px;background:
      linear-gradient(145deg,#f0f2f8 0%,#8293a4 18%,#334353 42%,#162230 100%);
      border:3px solid #c8d1dc;box-shadow:0 28px 80px rgba(0,0,0,.54),inset 0 3px 0 rgba(255,255,255,.52),inset 0 -12px 20px rgba(0,0,0,.38);padding:20px}
    .radio:before{content:"";position:absolute;left:22%;right:22%;top:-42px;height:38px;border-radius:18px;background:linear-gradient(90deg,#5a6372,#f8d8ff,#7656aa);border:3px solid #c7d3df;box-shadow:0 0 26px rgba(211,76,255,.74),inset 0 0 18px rgba(146,49,255,.84)}
    .radio:after{content:"";position:absolute;right:-7px;top:23%;width:14px;height:44%;border-radius:10px;background:linear-gradient(180deg,#d9e2ea,#53606d,#161f28);box-shadow:0 0 0 2px rgba(0,0,0,.34)}
    .topbar{height:36px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .leds{display:flex;gap:8px}.led{width:10px;height:22px;border-radius:8px;background:#1b222b;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}.led.green{background:#39f7cb;box-shadow:0 0 16px #39f7cb}.led.blue{background:#8e53ff;box-shadow:0 0 16px #8e53ff}
    .knobs{display:flex;gap:10px}.knob{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0f7ff,#7d8896 55%,#222b36);border:2px solid #d7e1ec;box-shadow:0 0 14px rgba(185,75,255,.32),inset -4px -5px 8px rgba(0,0,0,.36)}
    .screen{margin:14px 0 10px;border-radius:22px;border:3px solid #0a1520;background:#07121b;box-shadow:inset 0 0 22px rgba(82,255,222,.13);padding:12px;min-height:198px;display:grid;gap:10px}
    .screen b,.screen span{display:none}
    .display-bubble{border-radius:12px;background:#cfeeff;color:#6b4dd8;padding:12px;min-height:70px;font-size:16px;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
    .display-bubble.answer{background:#cff7f2;color:#14938f}
    .wavebar{height:42px;border-radius:14px;background:#071928;border:1px solid rgba(75,246,255,.32);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#bffcff}
    .wave{flex:1;height:24px;margin:0 12px;background:repeating-linear-gradient(90deg,#7d49ff 0 3px,transparent 3px 8px);filter:drop-shadow(0 0 7px #9d48ff);border-radius:999px}
    .speaker{width:92px;height:92px;margin:6px auto 8px;border-radius:50%;background:radial-gradient(circle,#07080b 0 33%,#303743 34% 39%,#090a0d 40% 100%);border:5px solid #cbd6e1;box-shadow:0 0 24px rgba(198,70,255,.86)}
    .slot{display:none}
    .controls{display:grid;place-items:center;margin-top:6px}
    .button{width:154px;height:154px;border:4px solid rgba(255,255,255,.72);border-radius:50%;background:radial-gradient(circle at 40% 28%,#ffd5f5,#ff5fbb 58%,#b4147d);color:#fff;font-size:21px;line-height:1.05;font-weight:900;box-shadow:0 0 0 7px rgba(144,63,255,.55),0 0 34px rgba(255,83,205,.9),0 18px 28px rgba(0,0,0,.34),inset 0 2px 0 rgba(255,255,255,.58);touch-action:none;user-select:none;-webkit-user-select:none;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.35)}
    .button:before{content:"";display:block;width:26px;height:26px;margin:0 auto 8px;border-radius:14px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.22)}
    .button.recording{transform:scale(.96);box-shadow:0 0 0 7px rgba(255,255,255,.35),0 0 40px rgba(255,71,87,.95),0 12px 22px rgba(0,0,0,.35);background:radial-gradient(circle at 40% 28%,#fff,#ff5160 58%,#b80d1f);color:#fff}
    .button.sending{transform:scale(.98);box-shadow:0 0 0 7px rgba(73,238,255,.5),0 0 38px rgba(73,238,255,.9),0 12px 22px rgba(0,0,0,.35);background:radial-gradient(circle at 40% 28%,#fff,#52f4ff 58%,#078092);color:#031014}
    .button:disabled{opacity:.74}
    .sidekeys{display:none}
    .status-panel{max-width:560px;width:100%;margin:0 auto;display:grid;gap:10px;background:#0f141c;border:1px solid #303a44;border-radius:14px;padding:12px;box-shadow:0 16px 36px rgba(0,0,0,.32)}
    .hint{margin:0;color:#d7e2ea;font-size:16px;font-weight:900;text-align:center}
    .log{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bubble{border-radius:10px;background:#151d26;border:1px solid #303d48;padding:10px;min-width:0}
    .bubble b{display:block;margin-bottom:5px;color:#55e6d9;font-size:11px;text-transform:uppercase}.bubble p{margin:0;color:#f6f8fb;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
    .fallback{display:grid;grid-template-columns:1fr auto;gap:8px}.fallback input{width:100%;border:1px solid #3b4854;background:#080c12;color:#fff;border-radius:10px;padding:12px;font-size:16px}.fallback input::placeholder{color:#7e8d98}.fallback button,.play{border:0;border-radius:10px;background:#55e6d9;color:#061114;padding:0 16px;font-weight:900}
    .image-upload{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.image-upload button{border:0;border-radius:10px;background:#2a3440;color:#e9f6ff;min-height:42px;padding:0 14px;font-weight:900}.image-upload span{color:#d7e2ea;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.image-upload img{width:54px;height:54px;object-fit:cover;border-radius:10px;border:1px solid #3b4854}.hidden-file{display:none}
    .play{display:none;width:100%;padding:13px;font-size:16px}.play.show{display:block}
    footer{max-width:560px;width:100%;margin:0 auto;color:#94a4b0;font-size:12px;text-align:center;font-weight:800}
    header{display:none}
    .app{display:block;min-height:100vh;padding:0 0 14px;background:#071019}
    .radio-wrap{padding:0;min-height:0;display:grid;place-items:center;background:#071019}
    .radio-shell{width:min(100vw,430px);aspect-ratio:9/16;display:block;position:relative;background:url("assets/sporsmals-lab.jpg") center/contain no-repeat}
    .image-text{position:absolute;z-index:2;left:31.8%;width:38.6%;margin:0;pointer-events:auto;overflow-y:auto;display:block;line-height:1.16;font-size:clamp(13px,3.45vw,18px);font-weight:900;letter-spacing:0;overflow-wrap:anywhere;text-shadow:0 1px 0 rgba(255,255,255,.35);scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .image-text::-webkit-scrollbar{display:none}
    .image-text.user{top:32.5%;height:8.7%;color:#7251da}
    .image-text.answer{top:45.3%;height:7.6%;color:#168f96}
    .image-text.empty{opacity:.42}
    .image-hotspot{position:absolute;z-index:4;left:7.2%;top:42.6%;width:12.6%;height:8.5%;border:0;border-radius:12px;background:transparent;color:transparent;font-size:0;opacity:.02;touch-action:manipulation}
    .image-hotspot:active{opacity:1;background:rgba(85,230,217,.2);box-shadow:0 0 0 7px rgba(255,255,255,.28),0 0 32px rgba(85,230,217,.9)}
    .image-hotspot:disabled{opacity:.01}
    .image-prompt{position:fixed;z-index:9;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(94vw,410px);display:none;gap:8px;padding:10px;border:1px solid rgba(85,230,217,.55);border-radius:14px;background:rgba(7,16,25,.92);box-shadow:0 16px 36px rgba(0,0,0,.46),0 0 24px rgba(85,230,217,.18);backdrop-filter:blur(10px)}
    .image-prompt.show{display:grid}
    .image-prompt .image-upload{grid-template-columns:auto 1fr auto}
    .image-prompt .fallback{grid-template-columns:1fr auto}
    .status-panel,footer{display:none}
    .toolbar{display:none}
    .radio{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;aspect-ratio:auto;border:0;border-radius:0;background:transparent;box-shadow:none}
    .radio:before,.radio:after,.topbar,.screen,.speaker,.sidekeys{display:none}
    .controls{position:absolute;left:0;right:0;top:0;bottom:0;margin:0;display:block}
    .button{position:absolute;left:50%;top:82.4%;transform:translate(-50%,-50%);width:39%;height:21.9%;border-radius:50%;border:0;background:transparent;color:transparent;font-size:0;box-shadow:none;opacity:.02}
    .button:before{display:none}
    .button:active,.button.recording{transform:translate(-50%,-50%) scale(.94);background:rgba(255,67,139,.36);box-shadow:0 0 0 10px rgba(255,255,255,.42),0 0 0 22px rgba(255,56,177,.26),0 0 46px rgba(255,83,205,.95),inset 0 0 34px rgba(255,255,255,.28);opacity:1}
    .button.sending{transform:translate(-50%,-50%) scale(.97);background:rgba(73,238,255,.26);box-shadow:0 0 0 10px rgba(255,255,255,.32),0 0 42px rgba(73,238,255,.95),inset 0 0 30px rgba(255,255,255,.22);opacity:.92}
    .button:disabled{opacity:.04}
    .status-panel{width:min(100% - 18px,430px);margin:10px auto 0;border-radius:12px}
    @media(max-width:430px){.app{padding-bottom:12px}.log{grid-template-columns:1fr}.fallback{grid-template-columns:1fr}.fallback button{min-height:44px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <span class="phase" aria-hidden="true"></span>
      <div class="brand"><h1>Spørsmåls Lab</h1><small>AI Kommunikator</small></div>
      <span id="phase" class="phase">Klar</span>
    </header>
    <section class="radio-wrap" aria-label="Sci-fi walkie talkie">
      <div class="radio-shell">
        <p id="screenTranscript" class="image-text user empty">Venter på beskjed.</p>
        <p id="screenAnswer" class="image-text answer empty">Klar.</p>
        <button id="imageButton" class="image-hotspot" type="button" aria-label="Last opp bilde">Last opp bilde</button>
        <nav class="toolbar" aria-hidden="true">
          <span class="toolicon">🎙</span>
          <span class="divider"></span>
          <span class="toolicon">▧</span>
          <span class="divider"></span>
          <span class="toolicon">▸</span>
        </nav>
        <div class="radio">
          <div class="topbar">
            <div class="leds"><span class="led green"></span><span class="led blue"></span><span class="led"></span></div>
            <div class="knobs"><span class="knob"></span><span class="knob"></span></div>
          </div>
          <div class="screen">
            <b>Trykk og snakk</b>
            <span>Kanal: Sandra / Backend: Bianca</span>
            <div class="display-bubble">Du</div>
            <div class="display-bubble answer">Svar</div>
            <div class="wavebar"><span>▌▌</span><span class="wave"></span><span>▶</span></div>
          </div>
          <div class="speaker" aria-hidden="true">
            <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span>
          </div>
          <div class="controls">
            <button id="ptt" class="button" type="button">TRYKK<br>OG SNAKK</button>
            <div class="sidekeys" aria-hidden="true"><span class="sidekey"></span><span class="sidekey"></span><span class="sidekey"></span></div>
          </div>
        </div>
      </div>
    </section>
    <section id="imagePrompt" class="image-prompt" hidden>
      <div class="image-upload">
        <button id="imageClear" class="clear" type="button" hidden>Fjern</button>
        <span id="imageStatus">Velg bilde først, spør etterpå.</span>
        <img id="imagePreview" alt="Valgt bilde" hidden>
      </div>
      <form id="textForm" class="fallback">
        <input id="textInput" autocomplete="off" placeholder="Hva vil du gjøre med bildet?">
        <button>Send</button>
      </form>
    </section>
    <section class="status-panel">
      <p id="hint" class="hint">Hold inne, snakk, slipp.</p>
      <button id="play" class="play" type="button">Spill svar</button>
      <div class="log">
        <div class="bubble"><b>Du sa</b><p id="transcript">Venter på beskjed.</p></div>
        <div class="bubble"><b>Sandra</b><p id="answer">Klar.</p></div>
      </div>
    </section>
  </main>
  <input id="imageInput" class="hidden-file" type="file" accept="image/*">
  <audio id="audio" preload="auto"></audio>
  <script>
    var BASE = 'https://marentscloud.duckdns.org:10443/bianca';
    var ptt = document.getElementById('ptt');
    var phase = document.getElementById('phase');
    var hint = document.getElementById('hint');
    var transcriptEl = document.getElementById('transcript');
    var answerEl = document.getElementById('answer');
    var screenTranscriptEl = document.getElementById('screenTranscript');
    var screenAnswerEl = document.getElementById('screenAnswer');
    var audio = document.getElementById('audio');
    var play = document.getElementById('play');
    var textForm = document.getElementById('textForm');
    var textInput = document.getElementById('textInput');
    var imagePrompt = document.getElementById('imagePrompt');
    var imageInput = document.getElementById('imageInput');
    var imageButton = document.getElementById('imageButton');
    var imageClear = document.getElementById('imageClear');
    var imagePreview = document.getElementById('imagePreview');
    var imageStatus = document.getElementById('imageStatus');
    var recognition = null, mediaRecorder = null, mediaStream = null, listening = false, sending = false, playingReply = false, speechUnlocked = false;
    var pendingTranscript = '', transcriptSent = false, ignoreNextClick = false, resetTimer = null, currentAudioUrl = null, recordedChunks = [], recordingMode = '', recordingStopRequested = false, recordTimer = null, recordingStartedAt = 0;
    var imageDataUrl = '';
    var MIN_RECORDING_MS = 1000;
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var silentWav = 'data:audio/wav;base64,UklGRkgAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YSQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
    audio.preload = 'auto';
    audio.playsInline = true;

    function setPhase(text, cls) {
      phase.textContent = text;
      ptt.className = 'button' + (cls ? ' ' + cls : '');
    }
    function setPttLabel(big, small) {
      ptt.innerHTML = big === 'TRYKK' && small === 'SNAKK' ? 'TRYKK<br>OG SNAKK' : big + '<br>' + small;
    }
    function setImageText(el, value, fallback) {
      var text = String(value || '').trim() || fallback;
      el.textContent = text;
      el.className = el.className.replace(/\s?empty/g, '') + (text === fallback ? ' empty' : '');
      el.scrollTop = 0;
    }
    function setTranscriptText(value) {
      var text = String(value || '').trim();
      transcriptEl.textContent = text || 'Venter på beskjed.';
      setImageText(screenTranscriptEl, text, 'Venter på beskjed.');
    }
    function setAnswerText(value) {
      var text = String(value || '').trim();
      answerEl.textContent = text || 'Klar.';
      setImageText(screenAnswerEl, text, 'Klar.');
    }
    function readyForNextTurn(status) {
      clearRecordTimer();
      sending = false;
      playingReply = false;
      listening = false;
      recordingMode = '';
      recordingStopRequested = false;
      recordingStartedAt = 0;
      ptt.disabled = false;
      textInput.disabled = false;
      imageButton.disabled = false;
      setPhase(status || 'Klar');
      setPttLabel('TRYKK', 'SNAKK');
      hint.textContent = 'Hold inne, snakk, slipp.';
    }
    function resizeImage(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('Kunne ikke lese bildet.')); };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () { reject(new Error('Kunne ikke åpne bildet.')); };
          img.onload = function () {
            var maxSide = 900;
            var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            var canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function clearImage() {
      imageDataUrl = '';
      imageInput.value = '';
      imagePreview.hidden = true;
      imagePreview.removeAttribute('src');
      imageClear.hidden = true;
      imageStatus.textContent = 'Velg bilde først, spør etterpå.';
      imagePrompt.hidden = true;
      imagePrompt.className = 'image-prompt';
      textInput.value = '';
      textInput.placeholder = 'Hva vil du gjøre med bildet?';
    }
    function setImage(file) {
      if (!file) return;
      resizeImage(file).then(function (dataUrl) {
        imageDataUrl = dataUrl;
        imagePreview.src = dataUrl;
        imagePreview.hidden = false;
        imageClear.hidden = false;
        imagePrompt.hidden = false;
        imagePrompt.className = 'image-prompt show';
        imageStatus.textContent = 'Bilde klart. Fortell hva du vil gjøre med bildet.';
        textInput.placeholder = 'Hva vil du gjøre med bildet?';
        window.setTimeout(function () { try { textInput.focus(); } catch (_) {} }, 80);
      }).catch(function (error) {
        imageStatus.textContent = error.message || 'Bilde-feil.';
      });
    }
    function clearAudioUrl() {
      if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
      currentAudioUrl = null;
      audio.removeAttribute('src');
      try { audio.load(); } catch (_) {}
    }
    function unlockSpeech() {
      if (speechUnlocked) return Promise.resolve(true);
      audio.src = silentWav;
      audio.volume = 0.01;
      return audio.play().then(function () {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = 1;
        speechUnlocked = true;
        return true;
      }).catch(function () { return false; });
    }
    function speakFromUrl(url) {
      if (!url) { readyForNextTurn('Klar'); return; }
      playingReply = true;
      clearAudioUrl();
      audio.src = url;
      audio.onplay = function () { setPhase('Snakker'); };
      audio.onended = function () { clearAudioUrl(); readyForNextTurn('Klar'); };
      audio.onerror = function () { clearAudioUrl(); readyForNextTurn('Lyd-feil'); };
      audio.play().catch(function () {
        play.className = 'play show';
        readyForNextTurn('Trykk spill');
      });
    }
    function resolveAudioUrl(data) {
      var publicUrl = String(data && data.publicAudioUrl || '').trim();
      if (publicUrl && !/127\.0\.0\.1|localhost/i.test(publicUrl)) return publicUrl;
      var audioUrl = String(data && data.audioUrl || '').trim();
      if (!audioUrl) return '';
      if (/^https?:\/\//i.test(audioUrl)) return audioUrl;
      if (audioUrl.indexOf('/bianca/') === 0) return 'https://marentscloud.duckdns.org:10443' + audioUrl;
      return BASE.replace(/\/$/, '') + '/' + audioUrl.replace(/^\/+/, '');
    }
    function setupRecognition() {
      if (!SpeechRecognition) {
        recognition = null;
        setPttLabel('TRYKK', 'REC');
        hint.textContent = window.MediaRecorder ? 'Hold inne, snakk, slipp.' : 'Denne nettleseren støtter ikke tale.';
        setPhase(window.MediaRecorder ? 'Klar' : 'Ingen tale');
        return;
      }
      if (recognition) {
        recognition.onstart = null;
        recognition.onend = null;
        recognition.onerror = null;
        recognition.onresult = null;
        try { recognition.abort(); } catch (_) {}
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'nb-NO';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onstart = function () {
        listening = true;
        pendingTranscript = '';
        transcriptSent = false;
        setPhase('Lytter', 'recording');
        setPttLabel('LYTTER', 'SLIPP');
        hint.textContent = 'Snakk nå.';
      };
      recognition.onend = function () {
        listening = false;
        setPttLabel('TRYKK', 'SNAKK');
        ptt.classList.remove('recording');
        var transcript = pendingTranscript.trim();
        if (transcript && !transcriptSent) {
          transcriptSent = true;
          sendText(transcript);
          resetRecognitionSoon();
          return;
        }
        if (phase.textContent === 'Lytter' || phase.textContent === 'Avslutter') setPhase('Klar');
        resetRecognitionSoon();
      };
      recognition.onerror = function (event) {
        listening = false;
        ptt.classList.remove('recording');
        setPhase(event.error || 'Tale-feil');
        hint.textContent = event.error || 'Talegjenkjenning feilet.';
        resetRecognitionSoon();
      };
      recognition.onresult = function (event) {
        var finalText = '';
        var interimText = '';
        for (var i = event.resultIndex; i < event.results.length; i++) {
          var text = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += text;
          else interimText += text;
        }
        pendingTranscript = (finalText || interimText || pendingTranscript).trim();
        if (pendingTranscript) {
          setTranscriptText(pendingTranscript);
          textInput.value = pendingTranscript;
        }
        if (finalText.trim() && !transcriptSent) {
          transcriptSent = true;
          try { recognition.stop(); } catch (_) {}
          sendText(finalText);
          resetRecognitionSoon();
        }
      };
    }
    function resetRecognitionSoon() {
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        resetTimer = null;
        setupRecognition();
      }, 120);
    }
    function clearRecordTimer() {
      if (recordTimer) {
        clearTimeout(recordTimer);
        recordTimer = null;
      }
    }
    function mediaRecorderType() {
      var options = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
      if (!window.MediaRecorder) return '';
      for (var i = 0; i < options.length; i++) {
        if (MediaRecorder.isTypeSupported(options[i])) return options[i];
      }
      return '';
    }
    function ensureMediaStream() {
      if (mediaStream && mediaStream.active) return Promise.resolve(mediaStream);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        return Promise.reject(new Error('Mikrofon krever HTTPS'));
      }
      return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        mediaStream = stream;
        return stream;
      });
    }
    function startRecordingFallback(e) {
      if (e) e.preventDefault();
      unlockSpeech();
      if (listening || sending || playingReply) return;
      listening = true;
      recordingMode = 'media';
      recordingStopRequested = false;
      setPhase('Tar opp', 'recording');
      setPttLabel('TAR OPP', 'SLIPP');
      hint.textContent = 'Snakk nå.';
      setTranscriptText('Tar opp...');
      ensureMediaStream().then(function (stream) {
        var type = mediaRecorderType();
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
        mediaRecorder.ondataavailable = function (event) {
          if (event.data && event.data.size) recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = finishRecordingFallback;
        transcriptSent = false;
        recordingStartedAt = performance.now();
        mediaRecorder.start();
        clearRecordTimer();
        recordTimer = setTimeout(stopRecordingFallback, 15000);
        if (recordingStopRequested) setTimeout(stopRecordingFallback, 120);
      }).catch(function (error) {
        listening = false;
        recordingMode = '';
        readyForNextTurn(error.message || 'Mikrofon-feil');
      });
    }
    function stopRecordingFallback(e) {
      if (e) e.preventDefault();
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        if (listening && recordingMode === 'media') {
          recordingStopRequested = true;
          setPhase('Slipper', 'sending');
        }
        return;
      }
      clearRecordTimer();
      setPhase('Sender lyd', 'sending');
      setPttLabel('VENT', 'STT');
      try { mediaRecorder.stop(); } catch (_) {}
    }
    function finishRecordingFallback() {
      clearRecordTimer();
      if (transcriptSent) return;
      transcriptSent = true;
      listening = false;
      sending = true;
      ptt.disabled = true;
      textInput.disabled = true;
      var type = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : 'audio/webm';
      var blob = new Blob(recordedChunks, { type: type });
      recordedChunks = [];
      var recordedMs = recordingStartedAt ? performance.now() - recordingStartedAt : 0;
      recordingStartedAt = 0;
      if (recordedMs > 0 && recordedMs < MIN_RECORDING_MS) {
        hint.textContent = 'For kort opptak, prøv igjen.';
        setTranscriptText('For kort opptak.');
        setAnswerText('Klar.');
        return readyForNextTurn('Feiltrykk');
      }
      if (!blob.size) return failed(new Error('Tomt lydklipp'));
      setTranscriptText('Transkriberer...');
      fetch(BASE + '/api/ptt', {
        method: 'POST',
        headers: { 'content-type': type },
        body: blob
      })
        .then(parseJsonResponse)
        .then(done)
        .catch(failed);
    }
    function startListening(e) {
      if (e) e.preventDefault();
      unlockSpeech();
      if (listening || sending || playingReply) return;
      if (!recognition) return startRecordingFallback(e);
      pendingTranscript = '';
      transcriptSent = false;
      recordingMode = 'speech';
      try {
        recognition.start();
      } catch (error) {
        if (!String(error.message || '').includes('already started')) startRecordingFallback(e);
      }
    }
    function stopListening(e) {
      if (e) e.preventDefault();
      if (recordingMode === 'media') return stopRecordingFallback(e);
      if (!recognition || !listening) return;
      setPhase('Avslutter');
      try { recognition.stop(); } catch (_) {}
    }
    function sendText(text) {
      var input = String(text || '').trim();
      if (!input && imageDataUrl) {
        imageStatus.textContent = 'Si eller skriv først hva du vil gjøre med bildet.';
        setPhase('Mangler spørsmål');
        hint.textContent = 'Fortell hva du vil gjøre med bildet.';
        return;
      }
      if (!input || sending) return;
      sending = true;
      ptt.disabled = true;
      textInput.disabled = true;
      imageButton.disabled = true;
      setTranscriptText(input);
      setPhase('Tenker', 'sending');
      setPttLabel('VENT', 'SANDRA');
      hint.textContent = imageDataUrl ? 'Sender bilde og ønsket handling.' : 'Sandra svarer.';
      var endpoint = imageDataUrl ? BASE + '/image-question' : BASE + '/api/text';
      var payload = imageDataUrl ? { question: input, image: imageDataUrl } : { text: input };
      fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
        .then(parseJsonResponse)
        .then(done)
        .catch(failed);
    }
    function parseJsonResponse(response) {
      return response.json().catch(function () {
        throw new Error('Uleselig svar fra backend');
      }).then(function (data) {
        if (!response.ok) throw new Error(data.error || ('Backend svarte ' + response.status));
        return data;
      });
    }
    function done(data) {
      if (!data.ok) return failed(new Error(data.error || 'Feil'));
      setTranscriptText(data.transcript || 'Ingen tekst.');
      setAnswerText(data.answer || 'Ingen svartekst.');
      textInput.value = '';
      var audioUrl = resolveAudioUrl(data);
      if (audioUrl) {
        speakFromUrl(audioUrl);
      } else {
        readyForNextTurn('Klar');
      }
    }
    function failed(err) {
      readyForNextTurn('Feilet');
      var message = err && err.message ? err.message : 'Noe feilet.';
      if (/load failed|failed to fetch|networkerror/i.test(message)) {
        message = 'Kunne ikke laste svar fra backend.';
      }
      hint.textContent = message;
      setAnswerText(hint.textContent);
    }
    textForm.addEventListener('submit', function (e) {
      e.preventDefault();
      unlockSpeech();
      sendText(textInput.value);
    });
    imageButton.addEventListener('click', function () { imageInput.click(); });
    imageClear.addEventListener('click', clearImage);
    imageInput.addEventListener('change', function () {
      setImage(imageInput.files && imageInput.files[0]);
    });
    play.addEventListener('click', function () { audio.play(); play.className = 'play'; });
    ptt.addEventListener('pointerdown', function (event) { event.preventDefault(); ignoreNextClick = true; startListening(event); });
    ptt.addEventListener('pointerup', function (event) { event.preventDefault(); stopListening(event); });
    ptt.addEventListener('pointercancel', stopListening);
    ptt.addEventListener('pointerleave', function (event) { if (event.pointerType !== 'mouse') stopListening(event); });
    ptt.addEventListener('touchstart', function (event) { event.preventDefault(); ignoreNextClick = true; startListening(event); }, { passive: false });
    ptt.addEventListener('touchend', function (event) { event.preventDefault(); stopListening(event); }, { passive: false });
    ptt.addEventListener('touchcancel', function (event) { event.preventDefault(); stopListening(event); }, { passive: false });
    ptt.addEventListener('click', function (event) {
      if (ignoreNextClick) { ignoreNextClick = false; return; }
      if (listening) stopListening(event);
      else startListening(event);
    });
    setTranscriptText('');
    setAnswerText('');
    setupRecognition();
    readyForNextTurn(SpeechRecognition || window.MediaRecorder ? 'Klar' : 'Ingen tale');
  </script>
</body>
</html>
